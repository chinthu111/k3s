apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        resources:
          requests:
            cpu: "250m"   # 250 millicores (0.25 CPU)
            memory: "256Mi"  # 256 MB RAM
          limits:
            cpu: "500m"   # 500 millicores (0.5 CPU)
            memory: "512Mi"  # 512 MB RAM
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-config
        configMap:
          name: grafana-config
