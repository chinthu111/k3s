apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: zenoh-monitoring
data:
  grafana.ini: |
    [server]
    http_port = 3000
    [auth.anonymous]
    enabled = true
    org_name = Main Org.
    org_role = Viewer
    [dashboards.json]
    enabled = true
    path = /var/lib/grafana/dashboards
