apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: zenoh-monitoring
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 1h
      chunk_retain_period: 24h
    schema_config:
      configs:
        - from: 2024-01-01 #Adjust the date.
          store: boltdb-shipper
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/boltdb-cache
      filesystem:
        directory: /loki/chunks
    limits_config:
      allow_structured_metadata: false
    common:
      path_prefix: /loki
