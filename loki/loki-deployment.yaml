apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:latest
        args: ["-config.file=/etc/loki/local-config.yaml"]
        ports:
        - containerPort: 3100
        resources:
          requests:
            cpu: "250m"   # 250 millicores (0.25 CPU)
            memory: "256Mi"  # 256 MB RAM
          limits:
            cpu: "500m"   # 500 millicores (0.5 CPU)
            memory: "512Mi"  # 512 MB RAM
        volumeMounts:
        - name: config
          mountPath: /etc/loki
      volumes:
      - name: config
        configMap:
          name: loki-config