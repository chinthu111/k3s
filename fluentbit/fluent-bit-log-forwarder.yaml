apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-log-forwarder
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit-log-forwarder
  template:
    metadata:
      labels:
        app: fluent-bit-log-forwarder
    spec:
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:latest
        resources:
          requests:
            cpu: "250m"   # 250 millicores (0.25 CPU)
            memory: "256Mi"  # 256 MB RAM
          limits:
            cpu: "500m"   # 500 millicores (0.5 CPU)
            memory: "512Mi"  # 512 MB RAM
        volumeMounts:
        - name: config-volume
          mountPath: /fluent-bit/etc/
        - name: app-logs
          mountPath: /var/log/app/
      volumes:
      - name: config-volume
        configMap:
          name: fluent-bit-config
      - name: app-logs
        emptyDir: {}