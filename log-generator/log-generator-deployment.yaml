apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
      - name: log-generator
        image: your-log-generator-image:latest # Replace with your image
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
