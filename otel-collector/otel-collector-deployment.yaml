apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        args: ["--config=/etc/otel-collector/otel-collector-config.yaml"]  # Fixed this line
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otel-collector  # Changed to a directory
        - name: app-logs
          mountPath: /var/log/zenoh-app
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-config
      - name: app-logs
        emptyDir: {}
