apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: zenoh-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        command: ["--config=/etc/otel-collector-config.yaml"]
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        - name: app-logs
          mountPath: /var/log/zenoh-app
        resources:
          requests:
            cpu: "250m"   # 250 millicores (0.25 CPU)
            memory: "256Mi"  # 256 MB RAM
          limits:
            cpu: "500m"   # 500 millicores (0.5 CPU)
            memory: "512Mi"  # 512 MB RAM
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-config
      - name: app-logs
        emptyDir: {}
