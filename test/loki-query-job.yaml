apiVersion: batch/v1
kind: Job
metadata:
  name: loki-query-test
  namespace: zenoh-monitoring
spec:
  template:
    spec:
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          LOKI_RESPONSE=$(curl -s "http://loki-service.zenoh-monitoring:3100/loki/api/v1/query_range?query={service=\"fluent-bit-log-forwarder\"}|~\"Test log message for Loki\"")
          if [[ "$LOKI_RESPONSE" == *'"Test log message for Loki"'* ]]; then
            echo "Loki test passed"
            exit 0
          else
            echo "Loki test failed"
            exit 1
          fi
      restartPolicy: Never
