apiVersion: batch/v1
kind: Job
metadata:
  name: fluent-bit-test-log
  namespace: zenoh-monitoring
spec:
  template:
    spec:
      containers:
      - name: test
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          kubectl exec -n zenoh-monitoring $(kubectl get pod -n zenoh-monitoring -l app=fluent-bit-log-forwarder -o jsonpath='{.items[0].metadata.name}') -- bash -c 'echo "Test log message for Loki" > /var/log/app/test-loki.log'
      restartPolicy: Never
  backoffLimit: 4