apiVersion: batch/v1
kind: Job
metadata:
  name: fluent-bit-test-log
  namespace: zenoh-monitoring
spec:
  template:
    spec:
      containers:
      - name: test
        image: busybox:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Test log message for Loki" > /test-logs/test-loki.log
        volumeMounts:
        - name: app-logs
          mountPath: /test-logs
      - name: fluent-bit-test
        image: fluent/fluent-bit:latest
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app/
          readOnly: false
      volumes:
      - name: app-logs
        emptyDir: {}
      restartPolicy: Never
  backoffLimit: 4